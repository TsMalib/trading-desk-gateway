# ---------------------------------------------------------------------------
# trading-desk-gateway
# Every value that differs between machines or is secret comes from an
# environment variable. See .env.example for the full list.
# ---------------------------------------------------------------------------

quarkus.application.name=trading-desk-gateway
quarkus.http.port=${HTTP_PORT:8080}

# --- Desk -------------------------------------------------------------------
desk.mode=${DESK_MODE:paper}

desk.ib.host=${IB_HOST:127.0.0.1}
# IB Gateway ports: 4002 paper, 4001 live on the same host; from another container on the
# trading-desk network (gnzsnz/ib-gateway socat relay) 4004 paper, 4003 live.
desk.ib.port=${IB_PORT:4002}
desk.ib.clientId=${IB_CLIENT_ID:1}
# 1 live, 3 delayed (quotes are then flagged delayed=true). See DeskConfig.Ib for timeouts/backoff.
desk.ib.marketDataType=${IB_MARKET_DATA_TYPE:1}

# Broker implementation (build time): ibkr | fake. Tests use the in-memory FakeBroker.
desk.broker=ibkr
%test.desk.broker=fake

desk.telegram.token=${TELEGRAM_BOT_TOKEN}
desk.telegram.chatId=${TELEGRAM_CHAT_ID}
desk.telegram.userId=${TELEGRAM_USER_ID}
# Telegram Bot API. Sends and edits time out quickly; getUpdates long-polls for 50 s on its own client.
quarkus.rest-client.telegram.url=https://api.telegram.org
quarkus.rest-client.telegram.connect-timeout=5000
quarkus.rest-client.telegram.read-timeout=15000
quarkus.rest-client.telegram-poll.url=https://api.telegram.org
quarkus.rest-client.telegram-poll.connect-timeout=10000
quarkus.rest-client.telegram-poll.read-timeout=65000

desk.mcp.apiKey=${MCP_API_KEY}
# Requests per minute on the MCP endpoint (default 30), see McpAuthFilter.
# desk.mcp.rateLimitPerMinute=30
# The MCP endpoint (streamable HTTP at /mcp, legacy SSE at /mcp/sse). McpAuthFilter guards this path.
quarkus.mcp.server.http.root-path=/mcp

# A PROPOSED proposal expires after this long without a decision (default 30m).
# desk.proposals.ttl=30m

# Orders (defaults in DeskConfig.Orders): EXIT waits desk.orders.cancelTimeout (10s) for IBKR to confirm the
# cancel of target and stop; unfilled entries are cancelled desk.orders.eodCancelMinutes (5) before the close.
# desk.orders.cancelTimeout=10s
# desk.orders.eodCancelMinutes=5

# Reconciler (recon.Reconciler): at startup once IBKR connects, after every reconnect and every 5 minutes.
# desk.recon.atStartup=true
# desk.recon.startupWait=5m
# desk.recon.firstLookback=7d

# Risk: defaults live in DeskConfig; override per key if needed, e.g.
# desk.risk.riskPerTradePct=0.5
desk.risk.whitelist=${RISK_WHITELIST:}

# --- Database ---------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Dev and test use Dev Services (a throwaway Postgres container). Prod reads env.
%prod.quarkus.datasource.jdbc.url=${DESK_DB_URL}
%prod.quarkus.datasource.username=${DESK_DB_USER}
%prod.quarkus.datasource.password=${DESK_DB_PASSWORD}
quarkus.datasource.devservices.image-name=postgres:17

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# --- Time -------------------------------------------------------------------
quarkus.jackson.timezone=UTC

# --- Dev / test placeholders (never real secrets) ---------------------------
%dev.desk.telegram.token=${TELEGRAM_BOT_TOKEN:dev-unset}
%dev.desk.telegram.chatId=${TELEGRAM_CHAT_ID:0}
%dev.desk.telegram.userId=${TELEGRAM_USER_ID:0}
%dev.desk.mcp.apiKey=${MCP_API_KEY:dev-unset}

%test.desk.mode=paper
%test.desk.telegram.token=test-token
%test.desk.telegram.chatId=1
%test.desk.telegram.userId=2
# Tests replace the Telegram client with a recording mock and feed updates directly.
%test.desk.telegram.polling=false
%test.quarkus.rest-client.telegram.url=http://127.0.0.1:1
%test.quarkus.rest-client.telegram-poll.url=http://127.0.0.1:1
%test.desk.mcp.apiKey=test-key
%test.desk.risk.whitelist=AAPL,MSFT
# Tests call scheduled jobs directly, against a fixed clock.
%test.quarkus.scheduler.enabled=false
%test.desk.recon.atStartup=false
%test.desk.orders.cancelTimeout=1s
