# ---------------------------------------------------------------------------
# trading-desk-gateway
# Every value that differs between machines or is secret comes from an
# environment variable. See .env.example for the full list.
# ---------------------------------------------------------------------------

quarkus.application.name=trading-desk-gateway
quarkus.http.port=${HTTP_PORT:8080}

# --- Desk -------------------------------------------------------------------
desk.mode=${DESK_MODE:paper}

desk.ib.host=${IB_HOST:127.0.0.1}
# IB Gateway default ports: 4002 paper, 4001 live
desk.ib.port=${IB_PORT:4002}
desk.ib.clientId=${IB_CLIENT_ID:1}

desk.telegram.token=${TELEGRAM_BOT_TOKEN}
desk.telegram.chatId=${TELEGRAM_CHAT_ID}
desk.telegram.userId=${TELEGRAM_USER_ID}

desk.mcp.apiKey=${MCP_API_KEY}

# Risk: defaults live in DeskConfig; override per key if needed, e.g.
# desk.risk.riskPerTradePct=0.5
desk.risk.whitelist=${RISK_WHITELIST:}

# --- Database ---------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Dev and test use Dev Services (a throwaway Postgres container). Prod reads env.
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.devservices.image-name=postgres:17

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

# --- Time -------------------------------------------------------------------
quarkus.jackson.timezone=UTC

# --- Dev / test placeholders (never real secrets) ---------------------------
%dev.desk.telegram.token=${TELEGRAM_BOT_TOKEN:dev-unset}
%dev.desk.telegram.chatId=${TELEGRAM_CHAT_ID:0}
%dev.desk.telegram.userId=${TELEGRAM_USER_ID:0}
%dev.desk.mcp.apiKey=${MCP_API_KEY:dev-unset}

%test.desk.mode=paper
%test.desk.telegram.token=test-token
%test.desk.telegram.chatId=1
%test.desk.telegram.userId=2
%test.desk.mcp.apiKey=test-key
%test.desk.risk.whitelist=AAPL,MSFT
